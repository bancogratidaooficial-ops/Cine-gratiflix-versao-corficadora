<title>CODIFICADOR - CINE GRATIFLIX</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial;padding:12px}
.box{background:#111;border:1px solid #222;border-radius:12px;padding:12px;margin-bottom:12px}
input,select,textarea{width:100%;padding:12px;background:#000;border:1px solid #333;color:#fff;border-radius:8px;margin:6px 0}
button{padding:12px 16px;border:0;border-radius:8px;font-weight:900;cursor:pointer;margin:4px}
.btn-verde{background:#00ff88;color:#000}.btn-vermelho{background:#f00;color:#fff}.btn-amarelo{background:#ffcc00;color:#000}
.filme-item{display:flex;justify-content:space-between;background:#000;padding:8px;margin:4px 0;border-radius:8px;font-size:12px}
.chip{display:inline-block;background:#222;border:1px solid #333;padding:6px 10px;border-radius:20px;margin:3px;font-size:11px}
.chip.ativo{background:#f00;border-color:#f00}
</style>
</head>
<body>
<h2>⚙️ CODIFICADOR CINE GRATIFLIX - 89 FILMES</h2>

<div class="box">
<b>📁 GERENCIAR PASTAS (GÊNEROS)</b>
<div style="display:flex;gap:6px"><input id="novaPasta" placeholder="Nome da pasta ex: AÇÃO"><button class="btn-amarelo" onclick="addPasta()">+ PASTA</button></div>
<div id="listaPastas"></div>
</div>

<div class="box">
<b>🎬 ADICIONAR FILME</b>
<input id="tFilme" placeholder="Título do filme ex: Hitimam">
<input id="idVideo" placeholder="ID do YouTube ex: x5QSOVQJM2w ou link completo https://youtu.be/...">
<select id="tagFilme"></select>
<button class="btn-verde" onclick="addFilme()">+ ADICIONAR FILME</button>
<hr>
<b>📥 COLAR VÁRIOS LINKS DE UMA VEZ (Aline)</b>
<textarea id="bulkLinks" rows="6" placeholder="Cole aqui todos os links https://youtu.be/... um por linha"></textarea>
<button class="btn-amarelo" onclick="addBulk()">ADICIONAR TODOS OS LINKS COMO LANÇAMENTO</button>
</div>

<div class="box">
<b>📋 FILMES CADASTRADOS (<span id="totalFilmes">0</span>)</b>
<div id="listaFilmes"></div>
</div>

<div class="box">
<b>🔗 GERAR LINK CODIFICADO E INDEX.HTML PERMANENTE</b>
<button class="btn-verde" style="width:100%;padding:16px" onclick="gerar()">GERAR TUDO</button>
<p>Link Codificado:</p>
<textarea id="outLink" rows="4" readonly></textarea>
<button class="btn-amarelo" onclick="copiarLink()">COPIAR LINK</button>
<button class="btn-verde" onclick="abrirLink()">ABRIR LINK E TESTAR</button>
<hr>
<p>index.html permanente (já com filmes fixos):</p>
<textarea id="outIndex" rows="8" readonly></textarea>
<button class="btn-verde" onclick="copiarIndex()">COPIAR INDEX.HTML</button>
</div>
